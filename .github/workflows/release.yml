name: Release

on:
  workflow_run:
    workflows: ["Echo"]
    types:
      - completed
  workflow_dispatch: {}

jobs:
  release:
    name: Semantic Release
    if: ${{ github.event.workflow_run.head_branch == 'api' || github.ref == 'refs/heads/api' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: api

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm semantic-release --debug
