name: Echo

on:
  push:
    branches:
      - api

jobs:
  echo:
    name: Echo Job
    runs-on: ubuntu-latest

    steps:
      - name: "Say Hello"
        run: echo "Hello, World! This is a dummy API workflow."

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs:
      - echo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release --debug
