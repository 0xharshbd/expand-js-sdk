name: Dynamic PR Template
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  update-pr-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set PR Body
        uses: actions/github-script@v6
        with:
          script: |
            const branch = context.payload.pull_request.base.ref;
            const body = context.payload.pull_request.body;

            let template = '';
            if (branch === 'develop') template = 'pr-develop.md';
            else if (branch === 'uat') template = 'pr-uat.md';
            else if (branch === 'api') template = 'pr-api.md';

            const fs = require('fs');
            const path = `.github/PULL_REQUEST_TEMPLATE/${template}`;

            if (!fs.existsSync(path)) {
              throw new Error(`Template file not found: ${path}`);
            }

            const templateBody = fs.readFileSync(path, 'utf8');

            await github.rest.pulls.update({
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              body: templateBody
            });

  check-commits:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

        # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

        # Restore Node modules cache
      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

        # Install dependencies (fast if cache hit)
      - name: Install dependencies
        run: npm ci

      - name: 🔎 Run commitlint on PR commits
        id: commitlint
        run: |
          npx commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }}
        continue-on-error: true

      - name: 💬 Comment if commitlint fails
        if: steps.commitlint.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const { owner, repo } = context.repo;
            const headBranch = context.payload.pull_request.head.ref;
            const body = `
              ❌ **Commit message check failed!**

              To keep things clean and readable, we follow [Conventional Commits](https://www.conventionalcommits.org/).

              ✨ Once you're done, this workflow will recheck and move forward!
              `;

              await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body
              });

              core.setFailed("Commitlint failed. Please update your commit messages.");

  labeler:
    needs: check-commits
    if: needs.check-commits.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

        # Restore Node modules cache
      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

        # Install dependencies (fast if cache hit)
      - name: Install dependencies
        run: npm ci

      - name: 🏷️ Label PR from commits
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const labelsToAdd = new Set();

            const commits = await github.rest.pulls.listCommits({
              owner,
              repo,
              pull_number: pr.number
            });

            const headerRegex = /^(\w+)(!?)(\([^)]+\))?:\s(.+)$/;

            for (const commit of commits.data) {
              const msg = commit.commit.message.trim();
              const body = commit.commit.body || "";
              const match = msg.match(headerRegex);
              const type = match?.[1];
              const isBreaking = match?.[2] === "!" || /BREAKING CHANGE:/i.test(body);

              if (isBreaking) labelsToAdd.add("breaking");

              switch (type) {
                case "feat": labelsToAdd.add("enhancement"); break;
                case "fix": labelsToAdd.add("bug"); break;
                case "chore": labelsToAdd.add("chore"); break;
                case "docs": labelsToAdd.add("docs"); break;
                case "refactor": labelsToAdd.add("refactor"); break;
                case "test": labelsToAdd.add("tests"); break;
                case "deps": labelsToAdd.add("dependencies"); break;
                case "ci": labelsToAdd.add("ci"); break;
                case "perf": labelsToAdd.add("performance"); break;
              }
            }

            if (labelsToAdd.size > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: [...labelsToAdd]
              });
              console.log(`Labels added: ${[...labelsToAdd].join(", ")}`);
            }
