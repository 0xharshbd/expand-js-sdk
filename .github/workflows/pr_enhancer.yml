name: Dynamic PR Template

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  update-pr-template:
    runs-on: ubuntu-latest
    steps:
      - name: Set PR Body
        uses: actions/github-script@v6
        with:
          script: |
            const branch = context.payload.pull_request.base.ref;
            let template = '';
            if (branch === 'develop') template = 'pr-develop.md';
            else if (branch === 'uat') template = 'pr-staging.md';
            else if (branch === 'api') template = 'pr-deployment.md';

            const fs = require('fs');
            const body = fs.readFileSync(`.github/PULL_REQUEST_TEMPLATE/${template}`, 'utf8');

            await github.rest.pulls.update({
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              body
            });
